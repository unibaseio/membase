[project]
name = "unibaseio-membase"
dynamic = ["version"]
description = "Membase SDK: the memory layer for AI agents, hosted or on your machine. Python client, CLI and MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Unibase" }]
keywords = ["membase", "memory", "agent-memory", "llm-memory", "long-term-memory", "llm", "ai", "agents", "mcp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
# Everything that runs on your machine: the unibaseio-membase-core engine (Python 3.12 or 3.13) with every model
# provider (OpenAI, Anthropic, Ollama) and the multimodal parser, plus the MCP library for
# `membase mcp`. The base install is the hosted client only.
local = [
    "unibaseio-membase-core[all]>=0.3.0; python_version >= '3.12'",
    "mcp>=1.0,<2",
]
# Media memory (photos, videos, audio): everything in [local], plus the engine's media extra,
# which brings torch for CLIP.
media = [
    "unibaseio-membase-core[all,media]>=0.4.0; python_version >= '3.12'",
    "mcp>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff==0.15.12"]

[project.scripts]
membase = "membase.cli:main"

[project.urls]
Homepage = "https://membase.com"
Documentation = "https://docs.membase.com"
Repository = "https://github.com/unibaseio/membase-ai"

[build-system]
requires = ["hatchling<1.28"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "membase/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["membase"]

[tool.hatch.build.targets.sdist]
include = ["/membase", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
