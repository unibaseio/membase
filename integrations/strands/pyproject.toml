[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "membase-strands"
version = "0.1.0"
description = "Membase memory for Strands Agents: a MemoryStore with time-boxed recall and deliberate search/save/profile tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Unibase" }]
keywords = ["strands", "strands-agents", "agents", "memory", "membase", "long-term-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# strands-agents>=1.45.0: first release with strands.memory (MemoryStore / MemoryManager,
# injection, get_tools). The offline tests pass on 1.45.0, 1.50.0, 1.55.0 and 1.61.1.
dependencies = [
    "strands-agents>=1.45.0",
    "unibaseio-membase>=0.3.2",
]

[project.optional-dependencies]
local = ["unibaseio-membase[local]>=0.3.2"]

[project.urls]
Homepage = "https://membase.com"
Documentation = "https://github.com/unibaseio/membase/tree/main/integrations/strands#readme"
Repository = "https://github.com/unibaseio/membase"
Issues = "https://github.com/unibaseio/membase/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/membase_strands"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
