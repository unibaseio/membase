[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "membase-haystack"
version = "0.1.0"
description = "Membase memory for Haystack: a memory store, a time-boxed retriever component and search/save/profile agent tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Unibase" }]
keywords = ["haystack", "haystack-ai", "agents", "memory", "membase", "long-term-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# haystack-ai>=2.18.0: the offline tests pass on 2.18.0, 2.24.0, 2.31.0, 3.0.0 and 3.4.1; on 2.12.0
# the Agent test fails.
dependencies = [
    "haystack-ai>=2.18.0",
    "unibaseio-membase>=0.4.0",
]

[project.optional-dependencies]
local = ["unibaseio-membase[local]>=0.4.0"]

[project.urls]
Homepage = "https://membase.com"
Documentation = "https://github.com/unibaseio/membase/tree/main/integrations/haystack#readme"
Repository = "https://github.com/unibaseio/membase"
Issues = "https://github.com/unibaseio/membase/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/membase_haystack"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
